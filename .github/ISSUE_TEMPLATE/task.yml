name: Task
description: One unit of work (2 hours at most) for one person and their agent
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: One or two sentences. What should exist when this is done?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checkable items. The agent keeps working until all of them are true.
      value: |
        - [ ]
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: Directories or files this task may touch
      placeholder: frontend/src/pages/
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Links to SPEC/CONTRACT sections, mentor notes, mock data, screenshots
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
  - type: dropdown
    id: estimate
    attributes:
      label: Estimate
      options:
        - 30 min
        - 1 h
        - 2 h
