<text x="60" y="66" font-size="14" fill="#52514e">Each fix round took the families already asked to 0; each new family found the same root cause on a new surface:</text>
<text x="60" y="86" font-size="14" fill="#52514e">the check verifies the number, not that it answers the storey, scope or name that was asked.</text>
