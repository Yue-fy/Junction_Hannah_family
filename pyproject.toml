[project]
name = "stoa"
version = "0.1.0"
description = "Junction 2026 / Stoa 'Make Blueprints Talk': verifiable QA over construction drawings"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "numpy",
    "pydantic>=2",
    "tqdm",
    "pillow",
    "shapely",
    "ezdxf",
    "pymupdf",
    "ifcopenshell",
    "opencv-python-headless",
    "openai",
    "fastapi",
    "uvicorn",
    "rapidfuzz",
    "pandas",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["stoa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
